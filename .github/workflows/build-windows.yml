name: Build SPP-Timers Windows

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build EXE
        run: |
          python -m PyInstaller SPP-Timers.spec

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SPP-Timers-Windows
          path: dist/
          retention-days: 1