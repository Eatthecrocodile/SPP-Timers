name: Build SPP-Timers macOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build APP
        run: |
          python -m PyInstaller SPP-Timers.spec

      - name: Create macOS ZIP
        run: |
          ls -la dist/
          ditto -c -k --sequesterRsrc --keepParent dist/SPP-Timers SPP-Timers-macOS-1.1.3.zip
          
      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SPP-Timers-macOS-1.1.3
          path: SPP-Timers-macOS-1.1.3.zip
          retention-days: 7
