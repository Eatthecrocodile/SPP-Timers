name: Build SPP-Timers macOS

on:
  push:
    branches:
      - main

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build APP
        run: |
          python -m PyInstaller SPP-Timers.spec

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: SPP-Timers-macOS
          path: dist/
          retention-days: 1